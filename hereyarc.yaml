name: hereya/aws-app-lambda
version: 0.5.11
description: API Gateway + Lambda + CloudFront-fronted Astro frontend, single distribution with backend behaviors at /api/*, /mcp, /oauth/*, and /.well-known/* (for MCP authentication per the MCP auth spec). Two domain modes — external DNS (non-blocking ACM cert via custom resource, manual records) or auto-Route53 (single-deploy DnsValidatedCertificate + ALIAS records when defaultRootDomain is exposed by the workspace). Optional deploy-time migration Lambda gated by a CloudFormation Custom Resource. Optional opt-in CloudWatch alarms (Lambda Errors/Throttles, API Gateway 5xx, and a silence alarm on the scheduled handler) published to an SNS topic the consumer owns — absent alertTopicArn = no alarm created. Optional opt-in API Gateway access log (JSON per request, with the integration fields that separate a gateway fault from a handler's own 500) plus per-route detailed metrics — absent accessLogRetentionDays = no log group created. Optional opt-in WORK QUEUE (workerQueue) — an SQS queue + dead-letter queue whose messages invoke the same worker handler as the cron, so background work starts when it is enqueued rather than on a clock, with redelivery, recovery after a killed invocation, and a DLQ alarm for work that never succeeded; absent = no queue. Optional opt-in VIEWER-COUNTRY behaviors (viewerCountryPaths) — the named path patterns get their own CloudFront behavior whose origin-request policy forwards CloudFront-Viewer-Country, the one header the all-viewer-except-Host policy structurally cannot carry; meant for an unauthenticated measurement endpoint, since the policy is an allow list and drops Authorization; absent = no extra behavior. Optional opt-in log-line alarms (logAlarms) turning a named log line on the app handler into a CloudWatch metric filter + alarm on the same topic — the one class of failure the metric alarms structurally cannot see, a component that refuses CLEANLY.
iac: cdk
infra: aws
deploy: true
visibility: public
